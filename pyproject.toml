[project]
name = "ledgerline"
version = "0.1.0"
description = "Automated pipeline for invoice/receipt extraction with mathematical validation and calibrated confidence routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.10",
    "reportlab>=4.2.0",
    "faker>=25.8.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "sentry-sdk[fastapi]>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mutmut>=2.4.5",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

